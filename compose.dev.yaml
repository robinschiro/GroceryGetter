services:
  api:
    image: grocery-getter-api:development
    build:
      context: .
      target: development
    command: ["npm", "run", "dev:api"]
    environment:
      HOST: 0.0.0.0
      PORT: 5174
      GROCERY_GETTER_DB_PATH: /app/data/grocery-getter.sqlite
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    ports:
      - "127.0.0.1:5174:5174"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5174/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./server
          target: /app/server
          initial_sync: true
        - action: sync
          path: ./shared
          target: /app/shared
          initial_sync: true
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
          initial_sync: true
        - action: sync
          path: ./tsconfig.server.json
          target: /app/tsconfig.server.json
          initial_sync: true
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  web:
    image: grocery-getter-web:development
    build:
      context: .
      target: development
    command: ["npm", "run", "dev:web:docker"]
    environment:
      GROCERY_GETTER_API_URL: http://api:5174
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./shared
          target: /app/shared
          initial_sync: true
        - action: sync
          path: ./index.html
          target: /app/index.html
          initial_sync: true
        - action: sync
          path: ./vite.config.js
          target: /app/vite.config.js
          initial_sync: true
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
          initial_sync: true
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
